name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobatech-backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
          
      - name: Install dependencies
        run: go mod download
        
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: mobatech-backend
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true
          install-mode: goinstall
          
      - name: Go Vet
        run: go vet ./...
        
      - name: Go Security Check
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
        
      - name: Run Tests
        run: go test -v -race -cover ./...

  crm:
    name: CRM Portal (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobatech-crm
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobatech-crm/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Type Check
        run: npx tsc --noEmit
        
      - name: Build
        run: npm run build

  flutter:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobatech-flutter
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Create .env file for build
        run: cp .env.example .env
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test

  ai:
    name: AI Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobatech-ai
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mobatech-ai/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Lint with flake8
        run: flake8 src

      - name: Run Tests
        run: |
          pip install pytest
          pytest src
